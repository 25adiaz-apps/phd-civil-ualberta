# p03-random-bridges-traffic. Same as p02-five-bridges-traffic (quarter car, no engine/mount/wheel,
# white phone noise, bridge excited by traffic, new roughness per crossing, 100 m before and after),
# with one change: instead of 5 fixed bridges, 300 random bridges whose properties are drawn
# independently with the tool's default ranges, so f1 is not a function of the span alone.
extends: ../p02-five-bridges-traffic/main.yaml
name: p03_main
description: >-
  p03-random-bridges-traffic: 300 random bridges x 5 crossings, bridge excited by traffic, new roughness
  per crossing, 100 m of road before and after; bridges and vehicles split into disjoint train/val/test groups.
bridge:
  span: {dist: uniform, low: 15.0, high: 60.0}                   # [m] Talebi-Kalaleh & Mei (2026), table 5
  f1: null                                                       # f1 = nominal_f1(span) * f1_factor
  f1_factor: {dist: uniform, low: 0.7, high: 1.3}                # [-] scatter around the nominal value
  mass_per_length: {dist: uniform, low: 4000.0, high: 20000.0}   # [kg/m]
  damping_ratio: {dist: uniform, low: 0.005, high: 0.03}         # [-] drawn for each mode
roughness:
  class: {dist: choice, values: [A, B, C], weights: [0.3, 0.4, 0.3]}   # ISO 8608, drawn per crossing
dataset:
  n_samples: 1500
  n_bridges: 300                  # 5 crossings per bridge
  partitions: [0.70, 0.15, 0.15]  # train / val / test: no bridge or vehicle in two groups
  bridge_catalog: null
